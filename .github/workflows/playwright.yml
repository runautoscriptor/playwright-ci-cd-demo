name: Playwright CI/CD Learning Workflow

# This workflow runs whenever code is pushed or a pull request is opened.
# It executes smoke, sanity, and regression suites as separate jobs.
on:
  push:
  pull_request:

jobs:
  smoke-suite:
    name: Smoke Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm exec -- playwright install --with-deps chromium

      - name: Run Smoke Suite
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: smoke-report
        run: npm run smoke

      - name: Upload Smoke Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke-report/
          if-no-files-found: warn

  sanity-suite:
    name: Sanity Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm exec -- playwright install --with-deps chromium

      - name: Run Sanity Suite
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: sanity-report
        run: npm run sanity

      - name: Upload Sanity Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-report
          path: sanity-report/
          if-no-files-found: warn

  regression-suite:
    name: Regression Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm exec -- playwright install --with-deps chromium

      - name: Run Regression Suite
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: regression-report
        run: npm run regression

      - name: Upload Regression Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: regression-report/
          if-no-files-found: warn
