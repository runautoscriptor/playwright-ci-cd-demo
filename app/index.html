<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playwright CI/CD Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Playwright CI/CD Playground</h1>
      <p class="subtitle">A simple login page for learning automation and GitHub Actions.</p>

      <form id="loginForm" class="card">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Enter username" />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter password" />

        <button id="loginButton" type="submit">Login</button>

        <p id="message" class="message" aria-live="polite"></p>
      </form>

      <button id="logoutButton" type="button" class="secondary hidden">Logout</button>

      <section id="dashboardPage" class="card hidden">
        <h2>Dashboard</h2>
        <p>Welcome to your dashboard.</p>
        <div class="nav-links">
          <a id="profileLink" href="#">Profile</a>
          <a id="dashboardLink" href="#" class="secondary-link hidden">Dashboard</a>
        </div>
        <p class="dashboard-note">Use the profile page to manage your details.</p>
      </section>

      <section id="profilePage" class="card hidden">
        <h2>Profile Management</h2>
        <div id="profileView">
          <p><strong>Full Name:</strong> <span id="fullNameValue">Jane Doe</span></p>
          <p><strong>Email:</strong> <span id="emailValue">jane@example.com</span></p>
          <p><strong>Mobile Number:</strong> <span id="mobileValue">9876543210</span></p>
          <button id="editProfileButton" type="button">Edit Profile</button>
        </div>

        <form id="profileForm" class="profile-form hidden">
          <label for="fullName">Full Name</label>
          <input id="fullName" name="fullName" type="text" value="Jane Doe" />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" value="jane@example.com" />

          <label for="mobileNumber">Mobile Number</label>
          <input id="mobileNumber" name="mobileNumber" type="text" value="9876543210" />

          <button id="saveProfileButton" type="button">Save Changes</button>
          <p id="profileMessage" class="message" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
